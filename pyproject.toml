[project]
name = "project_drawing_classifier"
version = "0.1.1"
description = "project_drawing_classifier using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,google-genai,litellm,tools]>=1.15.11,<2.0.0",
    "google-genai>=1.65.0",
    "pymupdf>=1.26.7",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "streamlit>=1.63.0",
]

[project.scripts]
kickoff = "project_drawing_classifier.main:kickoff"
plot = "project_drawing_classifier.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_drawing_classifier"]

[tool.crewai]
type = "flow"
project_id = "aebfce64-922a-4e2b-a0fa-185416b356e3"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]

